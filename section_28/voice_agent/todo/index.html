<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Black Todo App</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: #1e1e1e; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); width: 350px; }
        h1 { text-align: center; color: #bb86fc; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 10px; border-radius: 4px; border: 1px solid #333; background: #2c2c2c; color: white; }
        button { padding: 10px; background: #bb86fc; border: none; border-radius: 4px; color: #000; cursor: pointer; font-weight: bold; }
        button:hover { background: #9965f4; }
        ul { list-style: none; padding: 0; }
        li { background: #2c2c2c; padding: 10px; margin-bottom: 8px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .delete-btn { background: #cf6679; color: white; padding: 5px 10px; border-radius: 3px; font-size: 0.8rem; }
    </style>
</head>
<body>
     <div class='container'>
        <h1>Tasks</h1>
        <div class='input-group'>
            <input type='text' id='taskInput' placeholder='Add a new task...'>
            <button onclick='addTask()'>Add</button>
        </div>
        <ul id='taskList'></ul>
    </div>
    <script>
        function addTask() {
            const input = document.getElementById('taskInput');
            const taskList = document.getElementById('taskList');
            if (input.value.trim() === '') return;
            const li = document.createElement('li');
            li.innerHTML = `<span>${input.value}</span><button class='delete-btn' onclick='this.parentElement.remove()'>X</button>`;
            taskList.appendChild(li);
            input.value = '';
        }
    </script>
</body>
</html>
